name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: build
        run: npm run build
      - name: bundle size guard
        run: |
          size=$(du -sk dist | cut -f1)
          echo "dist=${size}KiB"
          test "$size" -lt 2048
      - uses: actions/upload-artifact@v4
        with:
          name: camilia-dist
          path: dist
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t camilia-web:ci .
      - name: smoke the image
        run: |
          docker run -d --name camilia-ci -p 127.0.0.1:8090:80 camilia-web:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8090/healthz-static && break || sleep 1; done
          docker run --rm --network container:camilia-ci curlimages/curl:8.10.1 -fsS http://127.0.0.1:8090/ | grep -q Camilia
          docker logs camilia-ci
          docker rm -f camilia-ci
