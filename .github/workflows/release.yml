name: release

# Production half of the release chain (SCRUM-21, SCRUM-40, SCRUM-46).
#
# Nothing in this workflow can deploy by itself: the Go/No-Go is the tag.
# Two tag shapes are accepted:
#   SP<n>-Release   sprint release published by a human (SP1-Release, SP2-Release...)
#   release/<sha>   explicit release of a single commit
# The quality gate runs on the tagged commit first; only then does `production`
# wait for `factory/production`, the status the VPS watcher posts after it
# deployed and health-checked that exact commit. A run can therefore never claim
# a deployment that did not happen.
on:
  push:
    tags:
      - "SP*-Release"
      - "release/*"

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  statuses: read

jobs:
  qualite:
    name: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: |
          pip install -r services/api/requirements-dev.txt
          python -m pytest -q
      - name: compose (dev et prod)
        run: |
          cd deploy/dev && cp .env.example .env && docker compose config --quiet && echo "dev compose: ok"
          cd ../prod && cp .env.example .env
          sed -i 's/^FACTORY_DB_PASSWORD=.*/FACTORY_DB_PASSWORD=ci-only-placeholder/' .env
          FACTORY_IMAGE_TAG=ci docker compose config --quiet && echo "prod compose: ok"
      - name: scan de secrets
        run: python scripts/secret_scan.py .

  production:
    name: production
    needs: qualite
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: resoudre le commit du tag
        run: |
          set -euo pipefail
          SHA="$(git rev-list -n1 "$GITHUB_REF")"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "$GITHUB_REF -> $SHA"
      - name: verifier que le tag pointe sur main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main: refusing to release a side branch"
            exit 1
          fi
          echo "$SHA is on main"
      - name: attendre le deploiement verifie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "waiting for the VPS to report factory/production on $SHA"
          end=$((SECONDS + 540))
          while [ "$SECONDS" -lt "$end" ]; do
            STATE="$(curl -sS --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
              | jq -r 'if type == "array" then ([.[] | select(.context == "factory/production")][0].state // "missing") else "api-error: " + (.message // "unexpected response") end')"
            echo "status: $STATE"
            case "$STATE" in
              api-error:*|"")
                echo "::error::could not read commit statuses (${STATE:-empty}); check the token's statuses scope"
                exit 1
                ;;
              success)
                echo "deployment of $SHA verified by the VPS"
                exit 0
                ;;
              failure|error)
                echo "::error::deployment of $SHA failed on the VPS ($STATE); the previous release was restored"
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "::error::no deployment status within 9 minutes (VPS: journalctl -u factory-release-watcher)"
          exit 1
