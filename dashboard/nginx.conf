# The password is per hostname, not per container: jannat/camilia stay private,
# while one host can be opened deliberately for an outside audit. "off" is the
# value nginx itself understands as "no authentication".
map $host $camilia_auth {
  default                 "Camilia";
  samya.nourredine.tech   off;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # no directory listing, no server tokens
  autoindex off;
  server_tokens off;

  # private dashboard by default: every path needs credentials. The htpasswd file
  # is mounted from the host at deploy time; no hash ever lands in the image or
  # the repository. samya.nourredine.tech is exempted by the map above.
  auth_basic $camilia_auth;
  auth_basic_user_file /etc/nginx/camilia.htpasswd;

  gzip on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # container liveness: proves nginx serves the bundle, not that the API is up
  location = /healthz-static {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # API proxy: the browser only ever talks to this origin (no CORS, no exposed API host)
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
  }

  # API health endpoints stay reachable through the same origin
  location = /healthz {
    proxy_pass http://api:8080/healthz;
    access_log off;
  }
  location = /readyz {
    proxy_pass http://api:8080/readyz;
    access_log off;
  }

  # hashed assets: immutable
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: every other path returns the shell, never a 404 page
  location / {
    try_files $uri $uri/ /index.html;
    # repeat: a location-level add_header disables inheritance from the server block
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
  }
}
