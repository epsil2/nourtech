# GitLab delivery pipeline for the AI Agent Factory (SCRUM-21).
#
# chemin: qualite -> production
#   qualite    : tests, compose des deux stacks (dev + prod), scan de secrets.
#                Runs on every merge request and on the default branch.
#   production : deployment on the VPS. MANUAL, default branch only, serialised,
#                needs all quality jobs. Nothing reaches production without a
#                human pressing the button (Go/No-Go gate).
#
# Required CI/CD variables (Settings > CI/CD > Variables, protected + masked):
#   DEPLOY_HOST   address of the VPS
#   DEPLOY_USER   ssh account allowed to run docker compose on the VPS
#   DEPLOY_SSH_KEY  type File: private key of that account
# The VPS keeps its own deploy/prod/.env (chmod 600); it is never stored in GitLab.
stages:
  - qualite
  - production

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DEPLOY_PATH: /opt/agent-factory/app

.quality_rules: &quality_rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

qualite:tests:
  stage: qualite
  image: python:3.12-slim
  <<: *quality_rules
  script:
    - pip install -r services/api/requirements-dev.txt
    - python -m pytest -q --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml

qualite:compose:
  stage: qualite
  image: docker:27-cli
  <<: *quality_rules
  script:
    - cd deploy/dev && cp .env.example .env && docker compose config --quiet && echo "dev compose: ok"
    - cd ../prod && cp .env.example .env
    - sed -i 's/^FACTORY_DB_PASSWORD=.*/FACTORY_DB_PASSWORD=ci-only-placeholder/' .env
    - FACTORY_IMAGE_TAG=ci docker compose config --quiet && echo "prod compose: ok"

qualite:secrets:
  stage: qualite
  image: alpine:3.20
  <<: *quality_rules
  script:
    - |
      if grep -rIn --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ --exclude-dir=.pytest_cache \
           -E 'ATATT[A-Za-z0-9_=-]{10,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|glpat-[A-Za-z0-9_-]{20,}' .; then
        echo "credential-shaped string committed" >&2
        exit 1
      fi
      echo "secret scan: ok"

production:deploy:
  stage: production
  image: alpine:3.20
  needs:
    - qualite:tests
    - qualite:compose
    - qualite:secrets
  resource_group: production
  environment:
    name: production
    url: http://127.0.0.1:8081/healthz
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - rsync -az --delete --exclude '.git' --exclude '.venv' --exclude '__pycache__' --exclude '.pytest_cache' --exclude 'deploy/prod/.env' ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && FACTORY_IMAGE_TAG=$CI_COMMIT_SHA ./scripts/deploy_prod.sh"
