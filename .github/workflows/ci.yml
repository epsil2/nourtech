name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r services/api/requirements-dev.txt

      - name: Unit, policy and security tests
        run: python -m pytest -q

      - name: Validate compose isolation (nothing started)
        working-directory: deploy/dev
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --format json > /tmp/compose.json
          python -c "import json,sys; c=json.load(open('/tmp/compose.json')); bad={n:s.get('ports') for n,s in c['services'].items() if s.get('ports')}; sys.exit('host ports published: %s' % bad) if bad else print('compose isolation check: ok')"

      - name: Fail on committed secrets
        run: python scripts/secret_scan.py .
