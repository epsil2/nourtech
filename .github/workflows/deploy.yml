name: deploy

# Release chain (SCRUM-21): DEV -> Qualite -> Production.
#   1. dev        : builds the API image and boots the real DEV stack (Postgres,
#                   Redis, API) on the runner, then checks /healthz and /readyz.
#                   An image that cannot serve does not reach quality gates.
#   2. qualite    : tests, Compose validation of both stacks, secret scan.
#   3. production : MANUAL (workflow_dispatch with confirm=deploy), main only,
#                   serialised, in the `production` environment. It streams
#                   `git archive` to the VPS over a restricted SSH key whose
#                   forced command only accepts "deploy <40-hex sha>", and the
#                   VPS runs the same scripts/deploy_prod.sh an operator would.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to release the current main to production'
        required: true
        type: string

concurrency:
  group: production-chain
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 2.24.51.199
  DEPLOY_USER: root

jobs:
  dev:
    name: dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build de l image API
        run: docker build -t agent-factory-api:ci services/api
      - name: demarrage de la stack DEV
        working-directory: deploy/dev
        run: |
          cp .env.example .env
          sed -i 's/^FACTORY_DB_PASSWORD=.*/FACTORY_DB_PASSWORD=ci-only-placeholder/' .env
          docker compose up -d --wait --wait-timeout 180
          docker compose ps
      - name: smoke DEV
        working-directory: deploy/dev
        run: |
          set -e
          docker compose exec -T api python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read().decode())"
          docker compose exec -T api python -c "import urllib.request;body=urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=5).read().decode();print(body);assert '\"ok\":true' in body.replace(' ','')"
      - name: arret de la stack DEV
        if: always()
        working-directory: deploy/dev
        run: docker compose down -v

  qualite:
    name: qualite
    needs: dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: |
          pip install -r services/api/requirements-dev.txt
          python -m pytest -q
      - name: compose (dev et prod)
        run: |
          cd deploy/dev && cp .env.example .env && docker compose config --quiet && echo "dev compose: ok"
          cd ../prod && cp .env.example .env
          sed -i 's/^FACTORY_DB_PASSWORD=.*/FACTORY_DB_PASSWORD=ci-only-placeholder/' .env
          FACTORY_IMAGE_TAG=ci docker compose config --quiet && echo "prod compose: ok"
      - name: scan de secrets
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ --exclude-dir=.pytest_cache \
               -E 'ATATT[A-Za-z0-9_=-]{10,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|glpat-[A-Za-z0-9_-]{20,}|BEGIN OPENSSH PRIVATE KEY' .; then
            echo "::error::credential-shaped string committed"
            exit 1
          fi
          echo "secret scan: ok"

  production:
    name: production
    needs: qualite
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write # publish the release tag
      statuses: read # read the deployment result reported by the VPS
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: publier le tag de release
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          git tag -f "release/$SHA"
          git push origin "refs/tags/release/$SHA"
          echo "release/$SHA published"
      - name: attendre le deploiement verifie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "waiting for the VPS to report factory/production on $SHA"
          end=$((SECONDS + 540))
          while [ "$SECONDS" -lt "$end" ]; do
            STATE="$(curl -sS --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
              | jq -r '[.[] | select(.context == "factory/production")][0].state // "missing"')"
            echo "status: $STATE"
            case "$STATE" in
              success)
                echo "deployment of $SHA verified by the VPS"
                echo "verified: /opt/agent-factory/state/last-good holds $SHA on the VPS"
                exit 0
                ;;
              failure|error)
                echo "::error::deployment of $SHA failed on the VPS ($STATE); the previous release was restored"
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "::error::no deployment status within 9 minutes (VPS watcher: journalctl -u factory-release-watcher)"
          exit 1
