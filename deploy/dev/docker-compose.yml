# AI Agent Factory - isolated DEV stack (SCRUM-19)
# Rules enforced by tests/test_compose_policy.py:
#   * project name is factory-specific (never collides with an existing project)
#   * the service network is internal: no egress, no published port
#   * PostgreSQL and Redis are reachable only from inside that network
#   * every service carries a healthcheck and a memory/CPU ceiling derived from
#     the measured host baseline (docs/baseline/vps-baseline-2026-11-14.md)
name: agent-factory-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FACTORY_DB_NAME:-factory}
      POSTGRES_USER: ${FACTORY_DB_USER:-factory}
      POSTGRES_PASSWORD: ${FACTORY_DB_PASSWORD:?FACTORY_DB_PASSWORD must be set in deploy/dev/.env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=25
      - -c
      - effective_cache_size=128MB
    volumes:
      - factory-db-data:/var/lib/postgresql/data
    networks:
      - factory-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M
    logging: *default-logging

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    networks:
      - factory-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M
    logging: *default-logging

  api:
    build:
      context: ../../services/api
    restart: unless-stopped
    environment:
      FACTORY_ENV: dev
      FACTORY_DB_HOST: db
      FACTORY_DB_PORT: "5432"
      FACTORY_DB_NAME: ${FACTORY_DB_NAME:-factory}
      FACTORY_DB_USER: ${FACTORY_DB_USER:-factory}
      FACTORY_DB_PASSWORD: ${FACTORY_DB_PASSWORD:?FACTORY_DB_PASSWORD must be set in deploy/dev/.env}
      FACTORY_CACHE_HOST: cache
      FACTORY_CACHE_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - factory-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging: *default-logging

networks:
  factory-internal:
    name: agent-factory-dev-internal
    driver: bridge
    internal: true
    labels:
      com.nourtech.owner: ai-agent-factory
      com.nourtech.env: dev

volumes:
  factory-db-data:
    name: agent-factory-dev-db-data
    labels:
      com.nourtech.owner: ai-agent-factory
      com.nourtech.env: dev
